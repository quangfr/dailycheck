<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Habitube hors ligne</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f4f7fb;
      color: #1f2933;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #e0fafc, #f4f7fb 45%);
    }
    main {
      text-align: center;
      padding: 32px;
      max-width: 320px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
      border: 1px solid #d5d8dc;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 1.5rem;
    }
    p {
      margin: 0 0 16px;
      line-height: 1.5;
      color: #475467;
    }
    button {
      background: #2a7a57;
      color: #fff;
      border: none;
      border-radius: 99px;
      padding: 10px 24px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }
    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Habitube hors ligne</h1>
    <p>Les assets et les habitudes sont déjà enregistrés. Reste connecté(e) ou recharge la page pour continuer dans ton jardin.</p>
    <p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </p>
    <p><a href="./index.html">Retour à l'accueil</a></p>
  </main>
</body>
</html>
